<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Think Art Press is an international art journal where young people make, write, and share.">
<title>Think Art Press · International art journal</title>
<style>
:root{--paper:#fffaf0;--ink:#211845;--purple:#321d62;--violet:#5330ad;--yellow:#ffd664;--pink:#f6cdde;--mint:#d5eed9;--line:#d4c8da;--serif:Georgia,serif;--sans:system-ui, sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 var(--sans)}a{color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9b37fa;outline-offset:4px}h1,h2,h3,p,figure{margin:0}h1,h2,h3{font-family:var(--serif);line-height:1.04;letter-spacing:-.045em}h1{font-size:clamp(3.2rem,8vw,7rem)}h2{font-size:clamp(2.2rem,4.8vw,4rem)}h3{font-size:clamp(1.55rem,2.75vw,2.25rem)}.wrap{width:min(1260px,calc(100% - 88px));margin:auto}.stripe{background:var(--purple);color:white;text-align:center;padding:9px 16px;font-size:.85rem;letter-spacing:.08em}.mast{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 0}.wordmark{font:bold clamp(1.55rem,4vw,2.55rem)/1 var(--serif);letter-spacing:-.06em;text-decoration:none}.wordmark i{color:var(--violet)}.nav{display:flex;flex-wrap:wrap;gap:2px 4px;padding:8px 0;border-block:1px solid var(--line)}.nav a{font-size:.875rem;text-decoration:none;padding:5px 9px;border-radius:6px}.nav a:hover,.nav a[aria-current=page]{background:var(--purple);color:white}.hero{display:grid;grid-template-columns:1fr 1fr;margin:24px auto 0;min-height:490px;border:1px solid var(--ink);border-radius:20px;overflow:hidden}.lead{padding:clamp(25px,5vw,70px);background:var(--purple);color:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:start;gap:18px}.lead em{color:var(--yellow);font-weight:normal}.lead p:not(.eyebrow){max-width:38ch;font-size:1.06rem}.eyebrow{font-size:.83rem;letter-spacing:.12em;text-transform:uppercase;font-weight:750}.hero figure{position:relative;min-height:290px;background:#ed9a66}.hero img{display:block;width:100%;height:100%;position:absolute;object-fit:cover}.hero figcaption{position:absolute;bottom:12px;right:12px;background:var(--paper);padding:5px 10px;border-radius:6px;font-size:.8rem}.btn{display:inline-block;background:var(--yellow);color:var(--ink);border:1px solid var(--ink);border-radius:7px;padding:9px 14px;text-decoration:none;font-weight:700;line-height:1.35}.btn:hover{background:white}.btn.alt{background:var(--paper)}.btn.alt:hover{background:var(--pink)}.section{padding:49px 0;border-bottom:1px solid var(--line)}.section>h2,.section>p,.section>.filters{margin-bottom:18px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}.section-head .eyebrow{margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:var(--pink);border:1px solid var(--ink);border-radius:12px;padding:20px;min-height:170px;display:flex;flex-direction:column;align-items:start;gap:10px}.card:nth-child(3n+2){background:var(--mint)}.card:nth-child(3n+3){background:#fff0ba}.card>.btn,.card>a:last-child,.card>button:last-child{margin-top:auto}.textlink{border:0;padding:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:4px;font-weight:700;text-align:left}.pagehead{padding:35px clamp(20px,5vw,56px);background:var(--mint);border:1px solid var(--ink);border-radius:14px;margin:24px 0 0}.pagehead h1{font-size:clamp(2.55rem,6.5vw,5.3rem);margin:12px 0}.pagehead p{max-width:65ch}.filters,.actions{display:flex;flex-wrap:wrap;gap:8px}.filters button{background:transparent;border:1px solid var(--ink);border-radius:20px;padding:6px 12px}.filters button[aria-pressed=true]{background:var(--purple);color:white}.banner{background:#fff0ba;border:1px solid var(--ink);border-radius:12px;padding:23px;margin:0 0 20px}.banner h3,.banner .actions{margin-top:8px}.feature{display:grid;grid-template-columns:1.05fr 1fr;background:var(--pink);border:1px solid var(--ink);border-radius:14px;overflow:hidden}.feature img{width:100%;height:100%;min-height:260px;object-fit:cover}.feature div{padding:clamp(24px,5vw,50px);display:grid;align-content:center;justify-items:start;gap:12px}.product-art{display:grid;place-items:center;width:100%;min-height:108px;border-radius:8px;background:#ffffff65;font:3.2rem var(--serif)}.form{max-width:600px;display:grid;gap:12px}.form label{display:grid;gap:5px;font-weight:650}.form input,.form textarea,.form select{width:100%;border:1px solid #76668a;border-radius:6px;padding:8px;background:white;color:var(--ink)}.form textarea{min-height:130px;resize:vertical}.form .btn{justify-self:start}.fine{font-size:.9rem}.tag{display:inline-block;background:white;border:1px solid var(--line);border-radius:10px;padding:2px 8px;font-size:.83rem}.step-list{padding-left:22px}.step-list li{margin-bottom:8px}.saved{min-height:1.5rem;margin-top:9px}.skip{position:absolute;left:-200vw}.skip:focus{left:10px;top:10px;z-index:10;background:white;padding:10px}dialog{width:min(640px,calc(100% - 30px));border:1px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);padding:25px}dialog::backdrop{background:#281d4dbb}dialog h2{margin:12px 0}dialog form{display:flex;justify-content:end}dialog p+p{margin-top:12px}.bagrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.bagrow button{white-space:nowrap}footer{margin-top:40px;background:var(--purple);color:white;padding:29px 0}footer .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:13px}footer .wordmark i{color:var(--yellow)}@media(max-width:825px){.wrap{width:calc(100% - 32px)}.hero{min-height:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:590px){.hero,.feature,.grid{grid-template-columns:1fr}.section{padding:35px 0}.section-head{align-items:start;flex-direction:column}.mast{gap:7px}.nav a{padding:5px 7px}.hero img{object-position:center}.feature img{min-height:0;aspect-ratio:1.5}.pagehead{margin-top:16px}}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="stripe">INTERNATIONAL ART JOURNAL FOR CHILDREN AND TEENS</div>
<header class="wrap">
<div class="mast"><a class="wordmark" href="#home">Think <i>Art</i> Press</a><button class="btn alt" type="button" id="bag">Bag (0)</button></div>
<nav class="nav" id="nav" aria-label="Journal sections"></nav>
</header>
<main class="wrap" id="content" tabindex="-1"></main>
<footer><div class="wrap"><a class="wordmark" href="#home">Think <i>Art</i> Press</a><p>An international journal for young artists and curious readers.</p></div></footer>
<dialog aria-labelledby="dialog-title" id="dialog"><form method="dialog"><button class="btn alt">Close</button></form><h2 id="dialog-title"></h2><div id="dialog-content"></div></dialog>
<script>
const pages=[
['weekly','Weekly Blog','Big news, small notebooks','Read the world through stories and drawing prompts for young journalists.'],
['live','Live Art','Make art together','A weekly workshop page for drawing alongside other young artists.'],
['print','Print Shop','Your art on everyday things','Preview how your drawing would look on a notebook, tote or wall print.'],
['craft','Handicrafts','Meet the makers','Support independent craft artists and explore the 50% Think Art Press child member discount.'],
['artists','Inspiration','Art across borders','Meet international artists through short introductions and studio activities.'],
['pets','Dogs & Cats','Paws, portraits and pet care','Tell the story of your dog or cat and teach other readers something about looking after them.'],
['doctors','Thank a Doctor','Letters to our local doctors','Write a few kind words about a doctor or care team in your community.'],
['recipes','Healthy Recipes','Recipes from young cooks','Share a colourful family recipe and show readers how to make it.'],
['grandparents','Grandparents','Awesome grandparents','Record a story, skill or small act of kindness you learned from a grandparent or elder.'],
['winners','Monthly Winners','The monthly gallery','A place to celebrate young artists and see how each month’s creative prompt can take a different shape.']
];
const stories=[
['Technology','What makes a robot helpful?','Draw a helpful machine and label each feature.','Pick an everyday job and ask how a robot could help. Sketch your design. Add a note about which decisions you would leave to a person.'],
['Current Affairs','Who gets shade in your city?','Use maps and observation to ask a question about your neighbourhood.','Sketch a public place you know. Mark shade, seating and paths. Then ask a family member what they would add and draw their suggestion in another colour.'],
['Inventions','A rain catcher for my balcony','Draw a small invention and explain what it does.','Sketch how you might collect rainwater for plants. Label the way water enters and exits. Think about what would happen during heavy rain.'],
['World Discoveries','Look closer at the shoreline','Start with something tiny and ask a bigger question.','Draw a shell or pebble you find near home. Record where you saw it and what surprised you. Look for a trusted nature guide and add one new thing you learn.'],
['The Universe','A notebook for the moon','Track the changing shape of the moon through drawings.','Look at the moon on several clear nights. Make a small sketch and note the date and time. Compare your drawings at the end of the week.'],
['Health','What helps us rest?','Illustrate an evening routine and ask your own questions.','Draw a short comic about getting ready for bed. Think about sound, light and activities. Ask a trusted adult where you can learn more about healthy sleep.']
];
const examples={
artists:[
['Japan','Yayoi Kusama','See what one repeating shape can do.','Cover a sheet with dots in two sizes. Leave one quiet corner and notice how it changes the picture.'],
['Sweden','Hilma af Klint','Think about colour and geometric forms.','Choose a feeling and represent it using only circles, lines and two colours.'],
['Ghana','El Anatsui','Explore repetition, texture and materials.','Arrange clean scraps of paper into a flexible surface. Try a different fold on each row.']],
pets:[
['Dog diary','What I take on a dog walk','An illustrated checklist for a walk with a grown-up.','I pack water, a lead and waste bags. My dog likes time to sniff. We make space for other people and animals on the path.'],
['Cat diary','A quiet spot for our cat','A story about learning to give a pet space.','I drew my cat’s favourite resting spots. When she walks away, I wait for her to come back. Our family asks a vet whenever we are unsure about her care.']],
doctors:[['Sample letter','Thank you for listening','A short note about being given time to ask a question.','Dear local doctor, thank you for explaining things in words I could understand. I appreciated the time you gave me to ask a question.']],
recipes:[['Sample recipe','Rainbow chickpea bowl','Chickpeas, crunchy vegetables and lemon.','With an adult, drain and rinse cooked chickpeas. Add diced cucumber, grated carrot and chopped tomato. Toss with a squeeze of lemon and serve. Check ingredient labels for any allergies.'],['Sample recipe','Banana and oat breakfast cup','A recipe for a quick breakfast with a grown-up.','Mash a banana and stir it through plain yoghurt and rolled oats. Top with fruit you like. If using dairy or packaged ingredients, check they suit everyone eating.']],
grandparents:[['Sample tribute','The afternoon we fixed a kite','A story about patience and a length of string.','My grandfather showed me how to repair a kite with paper and string. We tried it twice before it flew. Now I remember to keep spare paper in my craft box.']]
};
const goods={print:[['Notebook',450,'Notebook'],['Canvas tote',690,'Tote bag'],['Art print',850,'Wall print']],craft:[['Woven basket',1200,'Fiber craft'],['Block-printed pouch',600,'Textile craft'],['Hand-painted tray',900,'Wood craft']]};
const main=document.querySelector('main'),dialog=document.querySelector('#dialog'),dialogBody=document.querySelector('#dialog-content'),bagButton=document.querySelector('#bag');
let bag=[],member=false, artworkUrl='';
const rupees=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
const nav=document.querySelector('#nav');
nav.innerHTML=[['home','Home'],...pages].map(([id,label])=>'<a href="#'+id+'">'+label+'</a>').join('');
function show(title,body){document.querySelector('#dialog-title').textContent=title;dialogBody.replaceChildren(body);if(!dialog.open)dialog.showModal();}
function textNode(tag,value){const node=document.createElement(tag);node.textContent=value;return node;}
function openStory(list,index){const [label,title,summary,body]=list[index];const article=document.createElement('div');article.append(textNode('p',label),textNode('p',summary),textNode('p',body));show(title,article);}
function cards(list){return '<div class="grid">'+list.map(([label,title,summary],i)=>'<article class="card"><p class="eyebrow">'+label+'</p><h3>'+title+'</h3><p>'+summary+'</p><button class="textlink" data-story="'+i+'">Read <span hidden>'+title+'</span></button></article>').join('')+'</div>';}
function bindStories(list,scope=main){scope.querySelectorAll('[data-story]').forEach(button=>{button.setAttribute('aria-label','Read '+list[Number(button.dataset.story)][1]);button.onclick=()=>openStory(list,Number(button.dataset.story));});}
function intro([,label,title,description]){return '<header class="pagehead"><p class="eyebrow">'+label+'</p><h1>'+title+'</h1><p>'+description+'</p></header>';}
function home(){main.innerHTML='<section class="hero"><div class="lead"><p class="eyebrow">The young makers’ journal</p><h1>Small hands.<br><em>Big ideas.</em></h1><p>Make art, ask questions about the world, and share what you discover with other young creators.</p><div class="actions"><a class="btn" href="#weekly">Read the weekly journal</a><a class="btn alt" href="#winners">Visit the winners’ gallery</a></div></div><figure><img src="cover.png" alt="Cut-paper ocean waves and a pink flower beneath an orange sun"><figcaption>A garden at sea · Editorial illustration</figcaption></figure></section><section class="section"><div class="section-head"><div><p class="eyebrow">The weekly blog</p><h2>Look closer at the news</h2></div><a class="textlink" href="#weekly">All six topics</a></div>'+cards(stories.slice(0,3))+'</section><section class="section"><div class="feature"><img src="cover.png" alt="" loading="lazy"><div><p class="eyebrow">Monthly winners</p><h2>From the young artists’ gallery</h2><p>Explore the sample gallery and try this month’s art prompt.</p><a class="btn" href="#winners">See the gallery</a></div></div></section><section class="section"><h2>Explore the journal</h2><div class="grid">'+pages.map(([id,label,,description])=>'<article class="card"><h3><a href="#'+id+'">'+label+'</a></h3><p>'+description+'</p></article>').join('')+'</div></section>';bindStories(stories.slice(0,3));}
function draft(topic,prompt){return '<section class="section"><h2>Write a draft</h2><p>'+prompt+'</p><form class="form" id="draft"><label>Title<input name="title" required maxlength="90"></label><label>Your writing<textarea name="body" required maxlength="1800"></textarea></label><p class="fine">Drafts stay in this browser. Leave out full names, contact details, school names and private health information.</p><button class="btn">Save draft</button></form><p class="saved" id="notice" role="status"></p></section>';}
function bindDraft(id){const form=document.querySelector('#draft');if(!form)return;const key='tap-draft-'+id;try{const data=JSON.parse(localStorage.getItem(key)||'null');if(data){form.elements.title.value=data.title;form.elements.body.value=data.body;}}catch{}form.onsubmit=event=>{event.preventDefault();const fields=new FormData(form);try{localStorage.setItem(key,JSON.stringify({title:fields.get('title'),body:fields.get('body')}));document.querySelector('#notice').textContent='Draft saved on this device.';}catch{document.querySelector('#notice').textContent='This browser could not save the draft.';}};}
function renderWeekly(){main.innerHTML+= '<section class="section"><h2>Explore the topics</h2><div class="filters" aria-label="Filter weekly stories">'+['All',...stories.map(x=>x[0])].map((name,i)=>'<button type="button" aria-pressed="'+(i===0)+'">'+name+'</button>').join('')+'</div><div id="story-list"></div></section>'+draft('weekly','Pick a headline or question, describe what you learned, and sketch an idea to go with it.');const list=document.querySelector('#story-list');const buttons=[...main.querySelectorAll('.filters button')];function filter(index){const chosen=index?[stories[index-1]]:stories;buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));list.innerHTML=cards(chosen);bindStories(chosen,list);}buttons.forEach((button,i)=>button.onclick=()=>filter(i));filter(0);}
function live(){main.innerHTML+='<section class="section"><h2>Weekly workshop</h2><div class="banner"><p class="eyebrow">Sample session</p><h3>Make a cut-paper ocean</h3><p>Next live date and joining link are to be announced. Try the activity at home while you wait.</p><div class="actions"><button class="btn" id="lesson">Open the practice activity</button></div></div><p>Bring paper, a glue stick, and child-safe scissors. Ask a grown-up to help with cutting.</p></section>';document.querySelector('#lesson').onclick=()=>{const steps=document.createElement('ol');steps.className='step-list';for(const step of ['Tear three strips of blue paper and layer them like waves.','Cut simple shapes for a flower and sun. Move them around before gluing.','Add a title and write one sentence about what lives in your ocean.'])steps.append(textNode('li',step));show('Make a cut-paper ocean',steps);};}
function winner(){main.innerHTML+='<section class="section"><div class="feature"><img src="cover.png" alt="An orange sun and pink flower rising from layered blue waves"><div><p class="eyebrow">Sample monthly gallery</p><h2>A garden at sea</h2><p>This example shows how winning work can be presented with an artwork, a title and an artist’s statement.</p></div></div></section><section class="section"><h2>Try the monthly prompt</h2><p>Imagine a garden somewhere gardens do not usually grow. Draw what you would plant and write a sentence about how it survives there.</p></section>'+draft('winners','Write an artist’s statement for your piece. Describe where your garden grows and what inspired it.');}
function currentPrice(type,price){return type==='craft'&&member?price/2:price;}
function refreshBag(){bagButton.textContent='Bag ('+bag.length+')';}
function showBag(){const content=document.createElement('div');for(const [i,item] of bag.entries()){const row=document.createElement('div');row.className='bagrow';row.append(textNode('span',item.name+' · '+rupees.format(currentPrice(item.type,item.price))));const button=textNode('button','Remove');button.className='btn alt';button.setAttribute('aria-label','Remove '+item.name);button.onclick=()=>{bag.splice(i,1);refreshBag();showBag();};row.append(button);content.append(row);}content.append(textNode('p',bag.length?'Total '+rupees.format(bag.reduce((sum,item)=>sum+currentPrice(item.type,item.price),0))+' · Preview only':'Your bag is empty.'));show('Your bag',content);}
bagButton.onclick=showBag;
function storePage(type){const craft=type==='craft';main.innerHTML+='<section class="section"><div class="banner"><h3>'+(craft?'50% off for child members':'Try your artwork on a product')+'</h3><p>'+(craft?'Turn on the sample membership to see the discount on every handicraft. Membership registration and checkout are pending.':'Choose an image for a local preview. Your image stays on this device. Printing and checkout are pending.')+'</p><div class="actions">'+(craft?'<button class="btn" id="member" aria-pressed="'+member+'">'+(member?'Member preview on':'Try child member pricing')+'</button>':'<label class="btn alt">Choose artwork <input id="artwork" type="file" accept="image/png,image/jpeg,image/webp"></label>')+'</div></div><div id="items" class="grid"></div><p class="saved" role="status" id="store-status"></p></section>';
const items=document.querySelector('#items');function draw(){items.innerHTML=goods[type].map(([name,price,kind],i)=>'<article class="card"><div class="product-art" aria-hidden="true">'+(artworkUrl&&!craft?'<img src="'+artworkUrl+'" alt="" style="width:100%;height:125px;object-fit:contain">':['✦','✿','◆'][i])+'</div><p class="eyebrow">'+kind+'</p><h3>'+name+'</h3><p>'+(craft&&member?'<del>'+rupees.format(price)+'</del> ':'')+'<strong>'+rupees.format(currentPrice(type,price))+'</strong></p><button class="btn alt" data-product="'+i+'">Add to bag</button></article>').join('');items.querySelectorAll('button').forEach(button=>{const [name,price]=goods[type][Number(button.dataset.product)];button.setAttribute('aria-label','Add '+name+' to bag');button.onclick=()=>{bag.push({type,name,price});refreshBag();document.querySelector('#store-status').textContent=name+' added to your bag.';};});}draw();
if(craft){const toggle=document.querySelector('#member');toggle.onclick=()=>{member=!member;toggle.setAttribute('aria-pressed',String(member));toggle.textContent=member?'Member preview on':'Try child member pricing';draw();};}else document.querySelector('#artwork').onchange=event=>{const file=event.target.files[0];if(!file)return;if(artworkUrl)URL.revokeObjectURL(artworkUrl);artworkUrl=URL.createObjectURL(file);draw();};}
function route(focus=false){const key=location.hash.slice(1)||'home';if(key==='content')return;const page=pages.find(item=>item[0]===key);nav.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+(page?key:'home'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=page?page[1]+' · Think Art Press':'Think Art Press · International art journal';if(!page)home();else{main.innerHTML=intro(page);if(key==='weekly')renderWeekly();if(key==='live')live();if(key==='print'||key==='craft')storePage(key);if(key==='winners')winner();if(examples[key]){main.innerHTML+='<section class="section"><h2>'+(key==='artists'?'Artist spotlights':'Sample stories')+'</h2>'+cards(examples[key])+'</section>';bindStories(examples[key]);const prompts={pets:'Describe a pet’s habits and share one thing you learned about caring for them.',doctors:'Write about something a local doctor did that helped you feel cared for.',recipes:'List ingredients and steps. Note where a grown-up can help.',grandparents:'Share a memory, a useful skill, or a small kindness you remember.'};if(prompts[key]){main.insertAdjacentHTML('beforeend',draft(key,prompts[key]));bindStories(examples[key]);}}bindDraft(key);}if(focus){scrollTo(0,0);main.focus({preventScroll:true});}}
window.addEventListener('hashchange',()=>route(true));route();
</script>
</body>
</html>
