function home(){
const shortcuts=[['weekly','📖','Read & Write Blogs'],['live','▶','Join Live Art'],['print','👕','Print Your Art'],['craft','🛍','Shop Handicrafts'],['artists','🎨','Get Inspired'],['doctors','♡','Share & Care'],['winners','🏆','Win & Shine']];
main.innerHTML='<section class="edition-hero"><div class="edition-intro"><h1>Where Young Minds <mark>Create, Learn</mark> &amp; Inspire the World</h1><p>An international art and creativity journal for children and teens. Explore ideas, art, news, skills, and real-world stories.</p><div class="actions"><a class="pill primary" href="#weekly">Explore Journal</a><a class="pill alt" href="#community">Join the Community</a></div></div>'+artwork([421,100,778,313])+'</section><nav aria-label="Featured activities" class="feature-shortcuts">'+shortcuts.map(([id,icon,label])=>'<a class="shortcut" href="#'+id+'"><b aria-hidden="true">'+icon+'</b><span>'+label+'</span></a>').join('')+'</nav><section class="poster-grid" aria-label="Explore the ten journal pages">'+tileInfo.map(([id,title,desc,cta,color,box,reverse],i)=>'<article class="poster '+(i<4?'big ':'')+(reverse?'reverse ':'')+(id==='winners'?'winners':'')+'" style="--tile:'+color+'">'+artwork(box)+'<div class="poster-copy">'+(id==='craft'?'<span class="offer">50% OFF for child members</span>':'')+'<h2>'+title+'</h2><p>'+desc+'</p><a class="pill" href="#'+id+'">'+cta+'</a></div></article>').join('')+'</section>';
const band=document.createElement('div');band.className='community-end';band.style.backgroundImage="url('journal-art.png')";band.style.backgroundSize='100% '+(1312/69*100)+'%';band.style.backgroundPosition='center bottom';band.innerHTML='<span>A Global Creative Community for Children &amp; Teens</span>';main.append(band);
}
function community(){main.innerHTML=intro(['community','Global Community','Share, learn and create together','Choose a place to start. Your writing and artwork previews stay on this device.'])+'<section class="section"><div class="grid">'+tileInfo.filter(([id])=>['weekly','pets','doctors','recipes','grandparents','winners'].includes(id)).map(([id,title,description,cta])=>'<article class="card"><h3>'+title+'</h3><p>'+description+'</p><a class="btn" href="#'+id+'">'+cta+'</a></article>').join('')+'</div></section>';}
function draft(topic,prompt){return '<section class="section"><h2>Write a draft</h2><p>'+prompt+'</p><form class="form" id="draft"><label>Title<input name="title" required maxlength="90"></label><label>Your writing<textarea name="body" required maxlength="1800"></textarea></label><p class="fine">Drafts stay in this browser. Leave out full names, contact details, school names and private health information.</p><button class="btn">Save draft</button></form><p class="saved" id="notice" role="status"></p></section>';}
function bindDraft(id){const form=document.querySelector('#draft');if(!form)return;const key='tap-draft-'+id;try{const data=JSON.parse(localStorage.getItem(key)||'null');if(data){form.elements.title.value=data.title;form.elements.body.value=data.body;}}catch{}form.onsubmit=event=>{event.preventDefault();const fields=new FormData(form);try{localStorage.setItem(key,JSON.stringify({title:fields.get('title'),body:fields.get('body')}));document.querySelector('#notice').textContent='Draft saved on this device.';}catch{document.querySelector('#notice').textContent='This browser could not save the draft.';}};}
function renderWeekly(){main.innerHTML+= '<section class="section"><h2>Explore the topics</h2><div class="filters" aria-label="Filter weekly stories">'+['All',...stories.map(x=>x[0])].map((name,i)=>'<button type="button" aria-pressed="'+(i===0)+'">'+name+'</button>').join('')+'</div><div id="story-list"></div></section>'+draft('weekly','Pick a headline or question, describe what you learned, and sketch an idea to go with it.');const list=document.querySelector('#story-list');const buttons=[...main.querySelectorAll('.filters button')];function filter(index){const chosen=index?[stories[index-1]]:stories;buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));list.innerHTML=cards(chosen);bindStories(chosen,list);}buttons.forEach((button,i)=>button.onclick=()=>filter(i));filter(0);}
function live(){main.innerHTML+='<section class="section"><h2>Weekly workshop</h2><div class="banner"><p class="eyebrow">Sample session</p><h3>Make a cut-paper ocean</h3><p>Next live date and joining link are to be announced. Try the activity at home while you wait.</p><div class="actions"><button class="btn" id="lesson">Open the practice activity</button></div></div><p>Bring paper, a glue stick, and child-safe scissors. Ask a grown-up to help with cutting.</p></section>';document.querySelector('#lesson').onclick=()=>{const steps=document.createElement('ol');steps.className='step-list';for(const step of ['Tear three strips of blue paper and layer them like waves.','Cut simple shapes for a flower and sun. Move them around before gluing.','Add a title and write one sentence about what lives in your ocean.'])steps.append(textNode('li',step));show('Make a cut-paper ocean',steps);};}
function winner(){main.innerHTML+='<section class="section"><div class="feature"><img src="cover.png" alt="An orange sun and pink flower rising from layered blue waves"><div><p class="eyebrow">Sample monthly gallery</p><h2>A garden at sea</h2><p>This example shows how winning work can be presented with an artwork, a title and an artist’s statement.</p></div></div></section><section class="section"><h2>Try the monthly prompt</h2><p>Imagine a garden somewhere gardens do not usually grow. Draw what you would plant and write a sentence about how it survives there.</p></section>'+draft('winners','Write an artist’s statement for your piece. Describe where your garden grows and what inspired it.');}
function currentPrice(type,price){return type==='craft'&&member?price/2:price;}
function refreshBag(){bagButton.textContent='Bag ('+bag.length+')';}
function showBag(){const content=document.createElement('div');for(const [i,item] of bag.entries()){const row=document.createElement('div');row.className='bagrow';row.append(textNode('span',item.name+' · '+rupees.format(currentPrice(item.type,item.price))));const button=textNode('button','Remove');button.className='btn alt';button.setAttribute('aria-label','Remove '+item.name);button.onclick=()=>{bag.splice(i,1);refreshBag();showBag();};row.append(button);content.append(row);}content.append(textNode('p',bag.length?'Total '+rupees.format(bag.reduce((sum,item)=>sum+currentPrice(item.type,item.price),0))+' · Preview only':'Your bag is empty.'));show('Your bag',content);}
bagButton.onclick=showBag;
function storePage(type){const craft=type==='craft';main.innerHTML+='<section class="section"><div class="banner"><h3>'+(craft?'50% off for child members':'Try your artwork on a product')+'</h3><p>'+(craft?'Turn on the sample membership to see the discount on every handicraft. Membership registration and checkout are pending.':'Choose an image for a local preview. Your image stays on this device. Printing and checkout are pending.')+'</p><div class="actions">'+(craft?'<button class="btn" id="member" aria-pressed="'+member+'">'+(member?'Member preview on':'Try child member pricing')+'</button>':'<label class="btn alt">Choose artwork <input id="artwork" type="file" accept="image/png,image/jpeg,image/webp"></label>')+'</div></div><div id="items" class="grid"></div><p class="saved" role="status" id="store-status"></p></section>';
const items=document.querySelector('#items');function draw(){items.innerHTML=goods[type].map(([name,price,kind],i)=>'<article class="card"><div class="product-art" aria-hidden="true">'+(artworkUrl&&!craft?'<img src="'+artworkUrl+'" alt="" style="width:100%;height:125px;object-fit:contain">':['✦','✿','◆'][i])+'</div><p class="eyebrow">'+kind+'</p><h3>'+name+'</h3><p>'+(craft&&member?'<del>'+rupees.format(price)+'</del> ':'')+'<strong>'+rupees.format(currentPrice(type,price))+'</strong></p><button class="btn alt" data-product="'+i+'">Add to bag</button></article>').join('');items.querySelectorAll('button').forEach(button=>{const [name,price]=goods[type][Number(button.dataset.product)];button.setAttribute('aria-label','Add '+name+' to bag');button.onclick=()=>{bag.push({type,name,price});refreshBag();document.querySelector('#store-status').textContent=name+' added to your bag.';};});}draw();
if(craft){const toggle=document.querySelector('#member');toggle.onclick=()=>{member=!member;toggle.setAttribute('aria-pressed',String(member));toggle.textContent=member?'Member preview on':'Try child member pricing';draw();};}else document.querySelector('#artwork').onchange=event=>{const file=event.target.files[0];if(!file)return;if(artworkUrl)URL.revokeObjectURL(artworkUrl);artworkUrl=URL.createObjectURL(file);draw();};}
function route(focus=false){const key=location.hash.slice(1)||'home';if(key==='content')return;const page=pages.find(item=>item[0]===key);nav.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+(page||key==='community'?key:'home'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=page?page[1]+' · Think Art Press':'Think Art Press · International art journal';if(key==='community')community();else if(!page)home();else{main.innerHTML=intro(page);if(key==='weekly')renderWeekly();if(key==='live')live();if(key==='print'||key==='craft')storePage(key);if(key==='winners')winner();if(examples[key]){main.innerHTML+='<section class="section"><h2>'+(key==='artists'?'Artist spotlights':'Sample stories')+'</h2>'+cards(examples[key])+'</section>';bindStories(examples[key]);const prompts={pets:'Describe a pet’s habits and share one thing you learned about caring for them.',doctors:'Write about something a local doctor did that helped you feel cared for.',recipes:'List ingredients and steps. Note where a grown-up can help.',grandparents:'Share a memory, a useful skill, or a small kindness you remember.'};if(prompts[key]){main.insertAdjacentHTML('beforeend',draft(key,prompts[key]));bindStories(examples[key]);}}bindDraft(key);}if(focus){scrollTo(0,0);main.focus({preventScroll:true});}}
document.querySelector('#logo-art').innerHTML=artwork([49,5,75,48],'mark-art');
window.addEventListener('hashchange',()=>route(true));route();
</script>
</body>
</html>
